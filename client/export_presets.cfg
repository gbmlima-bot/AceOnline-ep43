[preset.0]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.f32,*.u8,*.bin"
exclude_filter="tests/*"
export_path="../build/macos/ACE-Modern.zip"

[preset.0.options]
application/bundle_identifier="org.acemodern.prototype"
application/short_version="0.8.0"
application/version="0.8.0"
application/architecture="universal"
codesign/codesign=1
notarization/notarization=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true

[preset.1]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.f32,*.u8,*.bin"
exclude_filter="tests/*"
export_path="../build/windows/ACE-Modern.exe"

[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
application/modify_resources=false
codesign/enable=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.2]
name="Linux Test"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.f32,*.u8,*.bin"
exclude_filter="tests/*"
export_path="../build/linux/ACE-Modern.x86_64"

[preset.2.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
